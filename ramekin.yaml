name: hello-web
# Platform of the target devices. %post in the final stage runs under qemu
# binfmt when it differs from the workstation; earlier stages run natively.
platform: linux/arm64

source:
  # def:     build an Apptainer definition file (infrastructure as code)
  # overlay: `ramekin shell` into the base image; changes persist in overlay.img
  mode: def
  # Def mode only: your definition file. Name it whatever you like.
  def: example.def
  # Overlay mode only: the base image to start from.
  base: docker://cgr.dev/chainguard/wolfi-base:latest
  overlay: overlay.img
  overlay_size_mb: 1024
  # Overlay mode only: the command the container runs.
  # runscript: /usr/bin/my-app

scan:
  # Severity at which `ramekin publish` refuses to ship: negligible|low|medium|high|critical|none
  fail_on: high
  # Accepted risks, e.g. CVE-2024-12345
  ignore: []

alerts:
  # Webhook that receives CVE alerts (Slack, Discord, Mattermost, ntfy, ...).
  webhook: ""
  min_severity: high

signing:
  key: keys/ramekin-sign.key
  pubkey: keys/ramekin-sign.pub

encryption:
  # age recipients that can decrypt releases. `ramekin keys generate` adds
  # the fleet key; `ramekin device init --own-key` adds per-device keys.
  recipients_file: keys/recipients.txt

releases:
  # GitHub repository for releases, as owner/repo. Devices download from it
  # anonymously, so use a public repository (images are encrypted; their
  # names and sizes are visible). Turn on immutable releases in its settings
  # (Settings > General > Releases) so published releases can't be changed.
  github: ascension-association/ramekin-simple-example
  # Branch holding the channel manifests devices poll (created on first publish).
  # Channel manifests live on main in this repository.
  branch: main
  # Token that can write the repository's contents and releases. Falls back
  # to GH_TOKEN, then `gh auth token`.
  token_env: GITHUB_TOKEN

channels: [stable]

# Official firmware the devices run (gokrazy, kernel and ramekind for the board).
firmware:
  github: ascension-association/firmware.r76s
  board: r76s
